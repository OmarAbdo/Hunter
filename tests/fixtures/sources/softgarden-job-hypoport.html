ast richtig Bock, dich weiterzuentwickeln, neue Technologien auszuprobieren und über den Tellerrand zu schauen.</p><p style=\"text-align: justify;\"><strong>Echte Fullstack-Erfahrung: </strong>Du bringst fundierte Erfahrung sowohl im Frontend als auch im Backend mit. Kein reiner Spezialist, sondern jemand, die sich in beiden Welten zuhause fühlt.</p><p style=\"text-align: justify;\"><strong>AI Coding ist für dich Alltag: </strong>Du nutzt AI Coding Agents wie Claude Code, Codex oder GitHub Copilot bereits aktiv in deiner täglichen Arbeit.</p><p style=\"text-align: justify;\"><strong>Tech Stack:</strong> Du beherrschst Java (Spring / Spring Boot) und/oder Python im Backend sowie Angular im Frontend. TypeScript setzt du idealerweise im Backend und für Infrastructure as Code (IaC) ein. Wichtig ist nicht, dass du alles auf Expertenlevel mitbringst, sondern dass du keine Berührungsängste hast, neue Technologien schnell lernst und offen für Neues bist.</p><p style=\"text-align: justify;\"><strong>Cloud-Erfahrung: </strong>Du hast bereits mit einem Hyperscaler gearbeitet;&nbsp;idealerweise AWS, aber auch Erfahrung mit Azure oder GCP ist willkommen. Kein Muss, aber ein klares Plus.</p><p style=\"text-align: justify;\"><strong>Teamplayerin mit Gestaltungsdrang</strong>: Du arbeitest gerne cross-funktional mit Product, Frontend, Data oder DevOps, und bringst dich aktiv in technische Entscheidungen und Diskussionen ein, statt nur Tickets abzuarbeiten.</p><p style=\"text-align: justify;\"><strong>Qualitätsanspruch: </strong>Sauberer, wartbarer Code ist für dich selbstverständlich. Du denkst in Tests, Reviews und nachhaltigen Lösungen und hast den Anspruch, Dinge nicht nur zum Laufen zu bringen, sondern richtig gut zu machen.</p>\n\n<b>Was erwartet dich bei uns?</b>\n<p style=\"text-align: justify;\"><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\"><strong>Ein Arbeitsplatz frei von Stereotypen!</strong> Die Energie unserer Teams wächst mit der Vielfalt an, mit den Perspektiven, die alle einbringen.</span></p><p style=\"text-align: justify;\"><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\"><strong>Vollzeit oder Teilzeit?</strong> Kinderbetreuung, psychische Belastung, Pflege von Angehörigen, Wiedereintritt ins Arbeitsleben nach längerer Pause - ganz egal aus welchen Gründen du nicht Vollzeit arbeiten kannst oder willst, bei uns ist Teilzeit genauso möglich.</span></p><p style=\"text-align: justify;\"><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\"><strong>Wir sind inklusiv!</strong> Ob spezielle Hilfsmittel, besondere Bedürfnisse oder sonstige Barrieren, wir sind motiviert eine Lösung zu finden, damit du bei uns so barrierefrei wie möglich arbeiten kannst. Gerne kannst du dich auch vor oder während des Bewerbungsprozesses mit Fragen zu Diversion an unser Diversity Team wenden: </span><a target=\"_blank\" rel=\"nofollow\" href=\"mailto:diversity@europace.de\"><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\">diversity@europace.de</span></a></p><p style=\"text-align: justify;\"><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\"><strong>What else? </strong>Auf </span><a target=\"_blank\" rel=\"nofollow\" href=\"https://neu.europace.de/\"><span style=\"background-color: transparent; color: rgb(17, 85, 204); font-family: Arial, sans-serif; font-size: 12pt;\"><u>@Europace</u></span></a><span style=\"background-color: transparent; color: rgb(0, 0, 0); font-family: Arial, sans-serif; font-size: 12pt;\">, dem </span><a target=\"_blank\" rel=\"nofollow\" href=\"https://tech.europace.de/\"><span style=\"background-color: transparent; color: rgb(17, 85, 204); font-family: Arial, sans-serif; font-size: 12pt;\"><u>Europac
